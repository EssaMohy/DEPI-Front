services:
  web:
    build:
      context: .
      target: production
      args:
        VITE_API_URL: ${VITE_API_URL:-http://backend:8000/api/v1}
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://backend:8000/api/v1}
    container_name: plantera-web
    restart: always
    ports:
      - "${FRONTEND_PORT:-3001}:3000"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits: { cpus: '0.5', memory: 512M }
        reservations: { cpus: '0.1', memory: 128M }
    networks:
      - plantera-network

networks:
  plantera-network:
    driver: bridge
